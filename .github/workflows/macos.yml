# macOS: build, codesign and pack a .dmg.
# Runs on its own (Actions tab > Run workflow) or is called by release.yml.
name: macOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: khmer_calendar
      - run: flutter build macos --release
        working-directory: khmer_calendar
      - name: Sign macOS app (codesign)
        env:
          PFX_B64: ${{ secrets.DESKTOP_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.DESKTOP_SIGN_PASSWORD }}
        run: |
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          bash scripts/sign-macos.sh "$APP"
      - name: Pack dmg
        run: |
          APP=$(find khmer_calendar/build/macos -name "*.app" | head -1)
          hdiutil create -volname "Khmer Calendar" -srcfolder "$APP" -ov -format UDZO KhmerCalendar.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: KhmerCalendar.dmg
